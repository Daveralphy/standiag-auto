name: standiag_auto
description: "Nigerian vehicle diagnostics and mechanic-connection mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  geolocator: ^9.0.2
  flutter_riverpod: ^3.3.1
  http: ^1.2.1
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  flutter_map: ^8.3.0
  flutter_blue_plus: ^1.32.12
  permission_handler: ^12.0.1
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - .env
    - assets/icons/nav/
    - assets/icons/general/
    - assets/icons/scan/
    - assets/icons/vehicle/
    - assets/icons/contact/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/standiag-logo.png"

flutter_native_splash:
  color: "#0B0B0F"
  image: assets/images/standiag-logo.png
  android: true
  ios: true
  android_12:
    color: "#0B0B0F"
    image: assets/images/standiag-logo.png




