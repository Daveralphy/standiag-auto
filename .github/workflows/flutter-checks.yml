name: Flutter checks

'on':
  push:
    branches:
      - refactor/redesign-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting of rebuilt code
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/app.dart lib/app lib/main.dart lib/firebase_options.dart test/app

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
